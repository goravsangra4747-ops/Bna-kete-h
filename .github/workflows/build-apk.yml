
name: Build GXRV DYNASTY APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GXRV-DYNASTY-Android-Project.zip"
      - "HomeScreen.kt"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q GXRV-DYNASTY-Android-Project.zip -d extracted

          GRADLEW=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Apply updated HomeScreen
        shell: bash
        run: |
          SOURCE="$GITHUB_WORKSPACE/HomeScreen.kt"
          TARGET="$PROJECT_DIR/app/src/main/java/com/gxrv/dynasty/ui/screens/HomeScreen.kt"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: HomeScreen.kt not found in repository root"
            exit 1
          fi

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: HomeScreen.kt target not found in Android project"
            exit 1
          fi

          cp "$SOURCE" "$TARGET"

          python3 - "$TARGET" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          replacements = {
              "Icons.Default.Calculate": "Icons.Default.Search",
              "Icons.Default.SwapHoriz": "Icons.Default.Menu",
              "Icons.Default.Storefront": "Icons.Default.Home",
              "Icons.Default.Forum": "Icons.Default.Email",
              "Icons.Default.Security": "Icons.Default.Lock",
              "Icons.Default.History": "Icons.Default.DateRange",
              "Icons.Default.Bolt": "Icons.Default.Star",
              "Icons.Default.Explore": "Icons.Default.Search",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          print("HomeScreen copied and icon names patched")
          PY

      - name: Fix MainActivity theme
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/gxrv/dynasty/MainActivity.kt"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "GxrvDynastyTheme.colors.background",
              "MaterialTheme.colorScheme.background"
          )

          if "import androidx.compose.material3.MaterialTheme" not in s:
              s = s.replace(
                  "import androidx.compose.material3.Surface",
                  "import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Surface"
              )

          p.write_text(s)
          print("MainActivity theme patched")
          PY

      - name: Fix unsupported Material icons
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/gxrv/dynasty/ui/navigation/NavGraph.kt"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          replacements = {
              "LocalFireDepartment": "Favorite",
              "Calculate": "Search",
              "SwapHoriz": "Menu",
              "Storefront": "Home",
              "Nightlight": "Star",
              "Forum": "Email",
              "Security": "Lock",
              "ChatBubble": "Email",
              "History": "DateRange",
              "AdminPanelSettings": "Settings",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          print("Navigation icons patched")
          PY

      - name: Fix TradeDateRangeScreen reference
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/gxrv/dynasty/ui/navigation/NavGraph.kt"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text().replace(
              "TradeDateRangeScreen",
              "TradeHistoryScreen"
          )
          p.write_text(s)
          print("Trade screen reference patched")
          PY

      - name: Enable AndroidX and configure Gradle memory
        shell: bash
        run: |
          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()

          settings = {
              "android.useAndroidX": "true",
              "org.gradle.jvmargs": "-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8",
              "org.gradle.workers.max": "2",
              "org.gradle.parallel": "false",
          }

          for key, value in settings.items():
              lines = [
                  line for line in lines
                  if not line.strip().startswith(key + "=")
              ]
              lines.append(f"{key}={value}")

          p.write_text("\n".join(lines) + "\n")
          print("Gradle memory settings updated")
          PY

      - name: Fix missing launcher icons
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import struct
          import zlib
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "app/src/main/res"

          def make_png(size):
              pixel = bytes([12, 35, 70, 255])
              raw = b"".join(b"\x00" + pixel * size for _ in range(size))

              def chunk(kind, data):
                  body = kind + data
                  return (
                      struct.pack(">I", len(data))
                      + body
                      + struct.pack(">I", zlib.crc32(body) & 0xffffffff)
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">2I5B", size, size, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw))
                  + chunk(b"IEND", b"")
              )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = root / folder
              target.mkdir(parents=True, exist_ok=True)

              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  path = target / name
                  if not path.exists():
                      path.write_bytes(make_png(size))

          print("Launcher icons checked")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gxrv-dynasty-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
